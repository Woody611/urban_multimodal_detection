# ⛔ 临时审计用 yaml —— 不是可用配置，请勿训练。
# 审计结论（diagnostic/lightfusion_design/_audit_and_sim.py）：
#   ① Conv(5,3,1,1) 经 make_divisible(min(3,512)*1.0, 8) 实际输出 8 通道，不是 3；
#   ② 在 backbone 前插入一层会使全网络绝对索引 +1，state_dict key 整体位移 →
#      标准 load() 只匹配 14/655，_transfer_rgb_pretrained 返回 0，整个 backbone 随机初始化。
# Candidate A：5->3 1x1 projection + 原 3ch YOLO11m（已被否证）。
ch: 5
nc: 12
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]
backbone:
  - [-1, 1, Conv, [3, 1, 1]]   # 0  <-- 新增：5 -> 3，1x1，stride 1
  - [-1, 1, Conv, [64, 3, 2]]  # 1
  - [-1, 1, Conv, [128, 3, 2]] # 2
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[17, 20, 23], 1, Detect, [nc]]
