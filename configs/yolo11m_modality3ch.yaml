# ============================================================
# Fusion Phase 0 — 单模态 3-channel 模型（M1 RGB / M2 IR / M3 Depth 共用）
# ============================================================
# 覆盖 ID: M1 (RGB-only) / M2 (IR-only) / M3 (Depth-only)
#
# 结构 = stock YOLO11m（与 ultralytics/cfg/models/11/yolo11.yaml 同构），
#        仅 nc 固定为 12、ch 显式写 3。
#
# ⚠ 为什么不用 configs/yolo11_visible.yaml：
#   那个文件只写了 `channels: 3`，**没有 `ch:`**；DetectionModel 读的是
#   `self.yaml.get("ch", ch)`（ultralytics/nn/tasks.py:347），
#   ch 参数默认 3 —— 它是**靠默认值侥幸正确**的，不是显式声明。
#   本文件把 `ch: 3` 写死，消除这一层隐式依赖。
#
# ⚠ 预训练迁移（READY）：
#   单 3ch stem + 无 1ch stem ⇒ `_transfer_rgb_pretrained`
#   （ultralytics/models/yolo/detect/train.py:296-298）走
#   `if not any(in_channels == 1): return 0`，
#   随后由标准 `model.load(weights)` 按 名字+shape 全量匹配 **yolo11m.pt**。
#   实测键匹配率需在 preflight 中确认（预期 = 全量，0 个 remap）。
#
# ⚠ 文件名必须含 'yolo11m'：guess_model_scale（nn/tasks.py:1299
#   正则 `yolo[v]?\d+([nslmx])`）按**文件名**解析 scale，否则静默回退 nano。
# ============================================================

ch: 3
# Parameters
nc: 12 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11m backbone（与 stock yolo11.yaml 逐项相同）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11m head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
