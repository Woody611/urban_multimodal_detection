# ============================================================
# Urban MultiModal — YOLOv11 中期融合（RGB+Depth，CBAM 注意力加权）
# ============================================================
# P3 局部改造：把融合节点的 SEAttention（纯通道注意力，已证负收益）换成 CBAM
#   （通道注意力 + 空间注意力）。空间注意力分支直接作用于 P3/P4/P5 融合特征，
#   针对性强化小目标所在的空间区域，比 SE 更贴合「小目标定位」诉求。
#   CBAM 已在 parse_model 登记（conv.py:313），纯 yaml 改动、零新增代码。
#
# 结构同 yolo11_midfusion_rgbd_se.yaml，仅把 SEAttention 换成 CBAM：
#   Concat -> CBAM -> Conv 1x1
#
# 输入: 4 通道 [R,G,B,D]。
# 用法:
#   python scripts/train.py --model_config configs/yolo11_midfusion_rgbd_cbam.yaml \
#       --train_config configs/train_multimodal_rgbd_v2.yaml
# ============================================================

ch: 4
# Parameters
nc: 12 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]                          # 0
  # ---- visible 分支 (3ch) ----
  - [0, 1, SilenceChannel, [0, 3]]                # 1
  - [-1, 1, Conv, [64, 3, 2]]                     # 2
  - [-1, 1, Conv, [128, 3, 2]]                    # 3
  - [-1, 2, C3k2, [256, False, 0.25]]             # 4
  - [-1, 1, Conv, [256, 3, 2]]                    # 5
  - [-1, 2, C3k2, [512, False, 0.25]]             # 6  (vis P3)
  # ---- depth 分支 (1ch) ----
  - [0, 1, SilenceChannel, [3, 4]]                # 7
  - [-1, 1, Conv, [64, 3, 2]]                     # 8
  - [-1, 1, Conv, [128, 3, 2]]                    # 9
  - [-1, 2, C3k2, [256, False, 0.25]]             # 10
  - [-1, 1, Conv, [256, 3, 2]]                    # 11
  - [-1, 2, C3k2, [512, False, 0.25]]             # 12 (depth P3)
  # ---- CBAM 注意力加权融合 P3 ----
  - [[6, 12], 1, Concat, [1]]                     # 13 (2x512=1024ch)
  - [-1, 1, CBAM, [7]]                            # 14 CBAM(c1=1024, kernel=7)
  - [-1, 1, Conv, [512, 1, 1]]                    # 15 (fused P3)
  # ---- P4 ----
  - [6, 1, Conv, [512, 3, 2]]                     # 16
  - [-1, 2, C3k2, [512, True]]                    # 17 (vis P4)
  - [12, 1, Conv, [512, 3, 2]]                    # 18
  - [-1, 2, C3k2, [512, True]]                    # 19 (depth P4)
  # ---- CBAM 注意力加权融合 P4 ----
  - [[17, 19], 1, Concat, [1]]                    # 20 (2x512=1024ch)
  - [-1, 1, CBAM, [7]]                            # 21
  - [-1, 1, Conv, [512, 1, 1]]                    # 22 (fused P4)
  # ---- P5 ----
  - [17, 1, Conv, [1024, 3, 2]]                   # 23
  - [-1, 2, C3k2, [1024, True]]                   # 24 (vis P5)
  - [19, 1, Conv, [1024, 3, 2]]                   # 25
  - [-1, 2, C3k2, [1024, True]]                   # 26 (depth P5)
  # ---- CBAM 注意力加权融合 P5 ----
  - [[24, 26], 1, Concat, [1]]                    # 27 (2x1024=2048ch)
  - [-1, 1, CBAM, [7]]                            # 28
  - [-1, 1, Conv, [1024, 1, 1]]                   # 29 (fused P5)
  - [-1, 1, SPPF, [1024, 5]]                      # 30
  - [-1, 2, C2PSA, [1024]]                        # 31

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 32
  - [[-1, 22], 1, Concat, [1]]                    # 33 cat fused P4
  - [-1, 2, C3k2, [512, False]]                   # 34
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 35
  - [[-1, 15], 1, Concat, [1]]                    # 36 cat fused P3
  - [-1, 2, C3k2, [256, False]]                   # 37 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]                    # 38
  - [[-1, 34], 1, Concat, [1]]                    # 39 cat head P4
  - [-1, 2, C3k2, [512, False]]                   # 40 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]                    # 41
  - [[-1, 31], 1, Concat, [1]]                    # 42 cat head P5
  - [-1, 2, C3k2, [1024, True]]                   # 43 (P5/32-large)
  - [[37, 40, 43], 1, Detect, [nc]]               # 44 Detect(P3, P4, P5)
