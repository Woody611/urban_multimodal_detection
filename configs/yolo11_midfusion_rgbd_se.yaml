# ============================================================
# Urban MultiModal Object Detection — YOLOv11 中期融合（RGB+Depth，SE 注意力加权）
# ============================================================
# 方案2(双模态·SE加权版): 在 RGB/Depth 两分支的 P3/P4/P5 三级融合节点，用
#   Concat + SEAttention + 1x1Conv 取代固定的 ADD 加权相加。
#
# 对比原「ADD 融合」(torch.add(x1, x2, alpha=0.5)，固定 1:0.5 加权)：
#   - SE 对拼接后的 [RGB|depth] 逐通道学习门控权重：RGB 清晰处权重高、
#     深度噪声大时自动压低 depth 通道，抑制深度对 RGB 特征的污染；
#   - 1x1 Conv 把 2C 通道投影回 C（通道对齐），并学习跨模态通道混合。
#   全部复用 fork 已注册模块（SEAttention 在 parse_model 已登记），零新增代码。
#
# 输入: 4 通道 [R,G,B,D]（SilenceChannel 切出 visible(3ch) / depth(1ch) 两分支）。
#
# 用法:
#   python scripts/train.py --model_config configs/yolo11_midfusion_rgbd_se.yaml \
#       --train_config configs/train_multimodal_rgbd.yaml
# ============================================================

ch: 4
# Parameters
nc: 12 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]                          # 0
  # ---- visible 分支 (3ch) ----
  - [0, 1, SilenceChannel, [0, 3]]                # 1
  - [-1, 1, Conv, [64, 3, 2]]                     # 2
  - [-1, 1, Conv, [128, 3, 2]]                    # 3
  - [-1, 2, C3k2, [256, False, 0.25]]             # 4
  - [-1, 1, Conv, [256, 3, 2]]                    # 5
  - [-1, 2, C3k2, [512, False, 0.25]]             # 6  (vis P3)
  # ---- depth 分支 (1ch) ----
  - [0, 1, SilenceChannel, [3, 4]]                # 7
  - [-1, 1, Conv, [64, 3, 2]]                     # 8
  - [-1, 1, Conv, [128, 3, 2]]                    # 9
  - [-1, 2, C3k2, [256, False, 0.25]]             # 10
  - [-1, 1, Conv, [256, 3, 2]]                    # 11
  - [-1, 2, C3k2, [512, False, 0.25]]             # 12 (depth P3)
  # ---- SE 注意力加权融合 P3 ----
  - [[6, 12], 1, Concat, [1]]                     # 13 (2x512=1024ch, [RGB|depth])
  - [-1, 1, SEAttention, [16]]                    # 14 SE 通道注意力（reduction=16）
  - [-1, 1, Conv, [512, 1, 1]]                    # 15 (fused P3, 1024->512)
  # ---- P4 各分支继续 ----
  - [6, 1, Conv, [512, 3, 2]]                     # 16
  - [-1, 2, C3k2, [512, True]]                    # 17 (vis P4)
  - [12, 1, Conv, [512, 3, 2]]                    # 18
  - [-1, 2, C3k2, [512, True]]                    # 19 (depth P4)
  # ---- SE 注意力加权融合 P4 ----
  - [[17, 19], 1, Concat, [1]]                    # 20 (2x512=1024ch)
  - [-1, 1, SEAttention, [16]]                    # 21
  - [-1, 1, Conv, [512, 1, 1]]                    # 22 (fused P4, 1024->512)
  # ---- P5 各分支继续 ----
  - [17, 1, Conv, [1024, 3, 2]]                   # 23
  - [-1, 2, C3k2, [1024, True]]                   # 24 (vis P5)
  - [19, 1, Conv, [1024, 3, 2]]                   # 25
  - [-1, 2, C3k2, [1024, True]]                   # 26 (depth P5)
  # ---- SE 注意力加权融合 P5 ----
  - [[24, 26], 1, Concat, [1]]                    # 27 (2x1024=2048ch)
  - [-1, 1, SEAttention, [16]]                    # 28
  - [-1, 1, Conv, [1024, 1, 1]]                   # 29 (fused P5, 2048->1024)
  - [-1, 1, SPPF, [1024, 5]]                      # 30
  - [-1, 2, C2PSA, [1024]]                        # 31

# YOLO11n head（共享 PAN-FPN，输入为融合后的 P3/P4/P5）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 32
  - [[-1, 22], 1, Concat, [1]]                    # 33 cat fused P4
  - [-1, 2, C3k2, [512, False]]                   # 34

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 35
  - [[-1, 15], 1, Concat, [1]]                    # 36 cat fused P3
  - [-1, 2, C3k2, [256, False]]                   # 37 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 38
  - [[-1, 34], 1, Concat, [1]]                    # 39 cat head P4
  - [-1, 2, C3k2, [512, False]]                   # 40 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 41
  - [[-1, 31], 1, Concat, [1]]                    # 42 cat head P5
  - [-1, 2, C3k2, [1024, True]]                   # 43 (P5/32-large)

  - [[37, 40, 43], 1, Detect, [nc]]               # 44 Detect(P3, P4, P5)
