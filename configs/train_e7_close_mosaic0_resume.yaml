# ============================================================
# Phase 6-A（续训）— E7 单变量实验 close_mosaic 10 -> 0
# ============================================================
# 用途：E7_close_mosaic0 原训练在 epoch 280（共 300）因意外关机中断，本配置用于续训。
#
# 与 configs/train_e7_close_mosaic0.yaml **逐行相同**，唯一差异在 checkpoint 块：
#   resume: false -> true
#   resume_path: "" -> runs/urban_multimodal_det_e7_close_mosaic0/weights/last.pt
# 其余（实验名、模型、imgsz、batch、epochs、patience、lr、优化器、数据、增强、close_mosaic=0）
# 全部保持原样，保证续训与中断前的训练完全同源。
#
# ⚠️ 续训机制（已核对 fork 源码，务必知悉）：
#   1. ultralytics/engine/trainer.py:693 check_resume() 在收到**布尔** resume=True 时，
#      会因为 `isinstance(resume,(str,Path))` 为 False 而走 get_latest_run() 兜底，
#      即真正续训的 checkpoint = `./**/last*.pt` 中 **ctime 最新** 的那个，
#      **而不是本文件 resume_path 指定的路径**（resume_path 只影响 YOLO() 的初始加载，
#      随后会被 check_resume 用 get_latest_run() 的结果覆盖）。
#      => 续训前必须先确认 get_latest_run() 选中的就是我们这个实验的 last.pt。
#   2. 续训时参数**整体取自 checkpoint**（trainer.py: `self.args = get_cfg(ckpt_args)`），
#      只有 imgsz / batch / device / close_mosaic 四个键允许被本文件覆盖。
#      因此 epochs=300、data、patience、优化器、lr 等都会被恢复成中断前的值。
#   3. 输出目录沿用 checkpoint 里的 save_dir（get_save_dir 对已设 save_dir 直接返回，
#      不做 increment），因此 **续训结果会写回原目录**，不会新建 xxx2 目录。
#   4. close_mosaic=0 时 trainer.py 的 `_close_dataloader_mosaic()` 触发条件
#      （start_epoch > epochs - 0 = 300）在续训起点 281 处不成立 => mosaic 继续保持开启，正确。
#
# 命令:
#   python scripts/train.py --model_config configs/yolo11m_midfusion_rgbd_concat_res.yaml \
#       --train_config configs/train_e7_close_mosaic0_resume.yaml
# ============================================================

experiment_name: "urban_multimodal_det_e7_close_mosaic0"
seed: 42
pretrained: "yolo11m.pt"

device: "cuda"
gpu_ids: [0]

epochs: 300
patience: 80
batch_size: 8
image_size: [1024, 1024]
num_workers: 4

learning_rate: 1.0e-2
warmup_epochs: 3

optimizer:
  type: "SGD"
  momentum: 0.937
  weight_decay: 5.0e-4

scheduler:
  type: "CosineAnnealingLR"

amp: true
val_ratio: 0.2

use_simotm: "RGBD"
pairs_rgb_ir: ["visible", "depth"]
pairs_rgb_depth: ["visible", "depth"]
channels: 4

# ---- 唯一变量：close_mosaic 10 -> 0（与原配置一致，续训不得改动）----
aug:
  close_mosaic: 0

checkpoint:
  save_dir: "runs/${experiment_name}/weights"
  save_interval: 10
  save_best: true
  save_last: true
  # ---- 与 configs/train_e7_close_mosaic0.yaml 的唯一差异 ----
  resume: true
  resume_path: "runs/urban_multimodal_det_e7_close_mosaic0/weights/last.pt"
