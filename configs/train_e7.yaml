# ============================================================
# E7 — YOLO11m + RGB+Depth 中期融合 + 1024（唯一变量: 相对 E6 改变输入分辨率 768 -> 1024）
# ============================================================
# 在 E6（YOLO11m RGBD pretrained, mAP50-95=0.48893, 768）基础上，仅将输入分辨率
# image_size [768,768] -> [1024,1024]，验证更高分辨率是否继续提升 mAP@0.5:0.95。
# model yaml 完全复用 E6 的 configs/yolo11m_midfusion_rgbd_concat_res.yaml（P3/P4/P5 三尺度），
# 不引入 P2。RGB 分支真正加载 yolo11m.pt 预训练（detect/train.py 的 _transfer_rgb_pretrained 做
# index 重映射，nl==3 路径），depth stem 用 W_depth = mean(W_R,W_G,W_B) 初始化。
# 优化器/aug/seed/切分与 E6 完全一致（lr0=1e-2, warmup 3, wd 5e-4），保证唯一变量是 imgsz。
# 显存: 1024^2/768^2 = 1.78x 激活显存；batch=16 优先，若 OOM 则改 batch=8（唯一资源适配变量，先报告）。
# 命令:
#   python scripts/train.py --model_config configs/yolo11m_midfusion_rgbd_concat_res.yaml \
#       --train_config configs/train_e7.yaml
# ============================================================

experiment_name: "urban_multimodal_det_e7_yolo11m_rgbd_1024"
seed: 42
pretrained: "yolo11m.pt"

device: "cuda"
gpu_ids: [0]

epochs: 300
patience: 80
batch_size: 16
image_size: [1024, 1024]
num_workers: 4

learning_rate: 1.0e-2
warmup_epochs: 3

optimizer:
  type: "SGD"
  momentum: 0.937
  weight_decay: 5.0e-4

scheduler:
  type: "CosineAnnealingLR"

amp: true
val_ratio: 0.2

use_simotm: "RGBD"
pairs_rgb_ir: ["visible", "depth"]
pairs_rgb_depth: ["visible", "depth"]
channels: 4

checkpoint:
  save_dir: "runs/${experiment_name}/weights"
  save_interval: 10
  save_best: true
  save_last: true
  resume: false
  resume_path: ""
