# ============================================================
# Urban Multi-Modal Object Detection — Model Configuration
# ============================================================
# 两阶段模型设计:
#   baseline — Visible 单模态目标检测 (验证基础 pipeline)
#   fusion   — Visible + Infrared + Depth 三模态融合检测
#
# 架构: Encoder(s) → [Fusion] → Neck → Head
# ============================================================

# ---- Model type (基线 / 融合切换) -------------------------
model_type: "baseline"               # baseline | fusion

# ---- Common -------------------------------------------------
num_classes: 12                      # 与 dataset.yaml 一致
input_size: [640, 640]               # [height, width]

# ============================================================
# Backbone (特征编码器)
# ============================================================
# baseline: 单一 Visible backbone
# fusion:   每个模态独立 backbone，结构相同、输入通道不同
# ============================================================
backbone:
  architecture: "CSPDarknet"         # 默认实现，可按需扩展
  variant: "s"                       # n | s | m | l | x
  output_strides: [8, 16, 32]        # 多尺度输出 → P3 / P4 / P5
  depth_multiple: 0.33               # 深度缩放因子
  width_multiple: 0.50               # 通道缩放因子

# ---- Neck ---------------------------------------------------
neck:
  architecture: "PAN"                # PAN | FPN | BiFPN
  depth_multiple: 0.33
  width_multiple: 0.50

# ---- Detection Head -----------------------------------------
detector_head:
  architecture: "DecoupledHead"      # DecoupledHead | CoupledHead
  num_scales: 3                      # 对应 P3 / P4 / P5
  strides: [8, 16, 32]              # 各检测尺度下采样倍率

# ---- Pretrained weights -------------------------------------
pretrained:
  enabled: false                       # 是否加载预训练权重
  path: ""                             # 预训练权重路径，留空则随机初始化

# ============================================================
# Modality (输入模态配置)
# ============================================================
modality:
  # baseline 仅使用 visible; fusion 使用全部三种
  enabled:                            # 由 model_type 决定实际使用
    - "visible"                       # baseline: ["visible"]
    # - "infrared"                    # fusion:  取消下方注释
    # - "depth"
  visible:
    in_channels: 3
  infrared:
    in_channels: 1
    stem_init: "mean_fill"            # 单通道→3通道 权重转换: mean_fill | random | zero_pad
  depth:
    in_channels: 1
    stem_init: "mean_fill"

# ============================================================
# Fusion Module (仅 model_type = "fusion" 时生效)
# ============================================================
fusion_method:
  architecture: "ConcatFusion"         # Visible feature + IR feature + Depth feature concat
  position: "middle"                   # early | middle | late
