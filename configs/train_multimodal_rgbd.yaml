# ============================================================
# Urban Multi-Modal Object Detection — RGB+Depth 双模态融合训练配置
# ============================================================
# 配合 configs/yolo11_midfusion_rgbd.yaml 使用。
# 由 scripts/train.py 读取（--train_config），模型 yaml 由 --model_config 指定。
#
# 数据加载（use_simotm=='RGBD'，见 ultralytics/data/{base,dataset,loaders}.py）:
#   - 读取 visible(BGR 3ch) + depth(灰度 1ch)
#   - depth 16-bit 映射到 uint8 [0,255]（<300mm 置 0，/19999*255）
#   - 合并为 4 通道 [B,G,R,D]（Format 后为 [R,G,B,D]）
#   - channels=4 门控增强分支（复用 RGBT 4ch 的 RandomHSV4C/Albumentations4C 路径）
#
# 与 train_multimodal.yaml（三模态 5ch）保持相同的调优超参，仅把模态从 RGB+IR+Depth
# 换成 RGB+Depth，便于做“剔除 IR 是否有增益”的干净消融对照。
# ============================================================

# ---- Experiment ----------------------------------------------
experiment_name: "urban_multimodal_det_yolo11_rgbd10"
seed: 42

# ---- Pretrain -------------------------------------------------
pretrained: true                     # true=ImageNet 预训练（visible 分支迁移；depth 分支随机初始化）

# ---- Device --------------------------------------------------
device: "cuda"                       # cuda | cpu
gpu_ids: [0]                         # 单卡: [0]; 多卡: [0,1,2,3]

# ---- Training hyperparameters --------------------------------
epochs: 200
patience: 80                         # 早停: 连续 80 epoch 无提升才停止（避免 epoch140 附近过早停）
batch_size: 16                       # 4ch 显存约为 RGB 的 1.33x，显存富余可提到 32
image_size: [640, 640]               # [height, width]
num_workers: 4

# ---- Learning rate -------------------------------------------
learning_rate: 5.0e-3                # 与 RGB 单模态一致
warmup_epochs: 10                    # 更长 warmup，给新增 depth 通道更长适应期
warmup_start_lr: 1.0e-6
min_lr_ratio: 0.01                   # 最终 lr = base_lr × min_lr_ratio

# ---- Data augmentation (4ch；恢复强增强。关键发现：hsv_v + mosaic 是深度数据的必要多样性来源) ----
aug:
  hsv_h: 0.015                       # RGB 分支 hue 微调（ultralytics 默认）
  hsv_s: 0.7                         # RGB 分支饱和度抖动（默认）
  hsv_v: 0.4                         # 关键：RandomHSV4C 用它同时抖动 RGB 亮度 + depth 亮度。
                                     # depth-only 消融证明缺它 mAP 从 0.312 崩到 0.145
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5                        # 左右翻转，检测关键增强
  mosaic: 1.0                        # 恢复默认强 mosaic（depth-only 依赖 mosaic=1.0）
  mixup: 0.0                         # 关闭（灰度 depth 是噪声）
  copy_paste: 0.0
  erasing: 0.4
  close_mosaic: 10                   # 最后 10 epoch 关闭 mosaic

# ---- Optimizer -----------------------------------------------
optimizer:
  type: "SGD"                        # SGD | Adam | AdamW
  momentum: 0.937
  weight_decay: 1.0e-4                # 降低正则化强度，让模型更自由拟合
  nesterov: true

# ---- Scheduler -----------------------------------------------
scheduler:
  type: "CosineAnnealingLR"          # CosineAnnealingLR | StepLR | MultiStepLR | OneCycleLR

# ---- Mixed precision -----------------------------------------
amp: true                            # Automatic Mixed Precision (FP16)

# ---- Gradient ------------------------------------------------
grad_clip_max_norm: 10.0

# ---- EMA (Exponential Moving Average) ------------------------
ema:
  enabled: true
  decay: 0.9999

# ---- Validation ----------------------------------------------
val_interval: 1                      # 每 N 个 epoch 验证一次
val_ratio: 0.2                       # 无独立 val 时，从 train 切分的验证集比例

# ---- 多模态 (RGB + Depth 双模态) ------------------------------
use_simotm: "RGBD"                   # RGBD = visible+depth 合并为 4ch
pairs_rgb_ir: ["visible", "depth"]   # visible 主输入 -> depth 第二模态（base.py 走 pairs_ir）
pairs_rgb_depth: ["visible", "depth"]  # depth 映射（dataset.py/loaders.py 走 pairs_depth）
channels: 4                          # 输入通道数（门控 4ch 增强分支）

# ---- Evaluation metrics --------------------------------------
evaluation_metric:
  - "mAP_0.5"
  - "mAP_0.5:0.95"

# ---- Checkpoint ----------------------------------------------
checkpoint:
  save_dir: "runs/${experiment_name}/weights"
  save_interval: 10
  save_best: true
  best_metric: "mAP_0.5:0.95"
  save_last: true
  max_keep: 5
  resume: false
  resume_path: ""

# ---- Logging -------------------------------------------------
log_dir: "runs/${experiment_name}/logs"
log_interval: 50
tensorboard:
  enabled: true
  log_dir: "runs/${experiment_name}/tensorboard"
