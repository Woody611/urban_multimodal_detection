# ============================================================
# D' = IR-CLAHE + Separate-Stem Fusion —— 训练配置
# ============================================================
# 本文件是 configs/train_rgbid_ir_clahe.yaml（= 线上 0.5553 的 D 的实际训练配置）
# 的**逐行副本**，唯一改动：
#
#   experiment_name: "urban_multimodal_det_yolo11_rgbid_ir_clahe"
#                 -> "urban_multimodal_det_yolo11_rgbid_sepstem_clahe"   （独立目录，绝不覆盖 D）
#
# 另一个变量（fusion architecture）不在本文件内，而由 CLI 的 --model_config 承载：
#   D : --model_config configs/yolo11m_earlyfusion.yaml   （单层 Conv(5→64,3,2)）
#   D': --model_config configs/yolo11m_sepstem.yaml       （3 stem 48/8/8 + Concat → 64）
#
# 因此 D vs D' 的差异**恰好两项**：model_config（fusion architecture） + experiment_name。
# 除此之外逐字相同（含 ir_encoding: clahe 与 patience: 0）。
#
# 命令:
#   python scripts/train.py --model_config configs/yolo11m_sepstem.yaml \
#       --train_config configs/train_rgbid_sepstem_clahe.yaml
#
# ⚠ 本文件由 train_rgbid_ir_clahe.yaml 复制而来，任何训练超参都**不得**在此改动 ——
#   动任何一项都会导致 D vs D' 不再是单变量对照。
# ============================================================

experiment_name: "urban_multimodal_det_yolo11_rgbid_sepstem_clahe_f1"
seed: 42
pretrained: "yolo11m.pt"

device: "cuda"
gpu_ids: [0]

epochs: 300
patience: 0              # 禁用早停（torch_utils.py:762 `patience or inf`）—— 与 D 的完整 300 epoch 预算严格一致
batch_size: 8
image_size: [1280, 1280]
num_workers: 4

learning_rate: 5.0e-3
warmup_epochs: 3

optimizer:
  type: "SGD"
  momentum: 0.937
  weight_decay: 5.0e-4

scheduler:
  type: "CosineAnnealingLR"

amp: true
val_ratio: 0.2

use_simotm: "RGBID"
pairs_rgb_ir: ["visible", "infrared"]
pairs_rgb_depth: ["visible", "depth"]
channels: 5

# ⚠️ 本实验的核心变量之一，**不可删**。放在这里（而不是文件末尾）是刻意的：
#    2026-09-20 的事故正是因为云上那份配置丢了这一行 —— base.py:333 会静默回落 percentile，
#    使 "IR-CLAHE + Separate-Stem" 变成 "percentile + Separate-Stem"。
#    scripts/train.py 现在会在缺这一行时**硬失败**；scripts/preflight_check_train_config.py 也会拦。
ir_encoding: clahe

# ============================================================
# F1 —— 唯一自变量：native-small instance exposure ↑
# ============================================================
# 在 D′ 的 augmentation pipeline **进入之前**（更早于 Mosaic），以固定概率 p 从**本图**
# native-small GT（native COCO area < 1024）中均匀随机取 1 个，按 scale=1.0（**仅平移**）
# 复制到本图内另一位置，并新增恰好 1 条标签。RGB/IR/Depth 同步性由「三者已在
# base.py:load_image 合并为单张 5ch 数组」保证 —— 一次 crop/paste 即三模态同矩形。
#
# 冻结常数（不在本文件暴露，由 augment.py 的 getattr 默认值固定）：
#   native_small_replay_small_area     = 1024   （native 面积阈值）
#   native_small_replay_margin         = 0.10   （crop 固定 context margin）
#   native_small_replay_max_dest_iou   = 0.10   （与任一已有 GT 的最大 IoU）
#   native_small_replay_max_src_dst_iou= 0.10   （与 source 框的最大 IoU）
#   native_small_replay_max_attempts   = 20     （每轮 destination 重采样上限）
#   instance_scale = 1.0 / rotation = 0 / shear = 0 / perspective = 0
#
# ⚠ 与 ultralytics 原生 copy_paste **不是同一变量**；本配置的 aug.copy_paste 保持 0。
# 删除本键（或置 0.0）⇒ 零 RNG 开销的 passthrough ⇒ 与 D′ 逐位等价。
#
# ⚠ p 的取值依据（preflight 实测，见 diagnostic/f1_native_small_replay/_exposure.json）：
#   只有 401/1600 = 25.06% 的训练图含 >=1 个 native-small GT ⇒ **p 是「eligible 条件下的概率」**。
#   p=0.30 ⇒ 每图实际 replay 率 7.5% ⇒ 总 exposure 仅 +8.6%（功效不足）。
#   本实验取 **p=1.0 + 每图 <=2 个** ⇒ 每图实际 replay 率 25.06%，总 exposure ≈ +57.6%。
#   该组合在开训前一次性定死；开训后**不得**再改（协议 §38）。
native_small_replay: 1.0
native_small_replay_max_new_instances: 2

checkpoint:
  save_dir: "runs/${experiment_name}/weights"
  save_interval: 10
  save_best: true
  save_last: true
  resume: false
  resume_path: ""

# ---- D 的唯一变量：IR 对比度处理 percentile -> CLAHE（D' 必须继承，不得改动）----
# percentile(默认) = 1%/99% 分位数线性拉伸（baseline 既有行为）
# clahe           = CLAHE(clipLimit=2.0, tileGridSize=(8,8))，与 percentile 互斥（非叠加）
# 二者在 base.py 的 RGBID 分支中二选一；CLAHE 的 in/out dtype 与 range 均与 percentile 相同。
#
# 注意：实际的 `ir_encoding: clahe` 键写在**文件上方**（紧跟 channels），此处只留说明 ——
#       放在末尾时极易在手工复制/截断时丢失，那正是 2026-09-20 事故的成因。
