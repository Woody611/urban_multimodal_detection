# ============================================================
# Urban MultiModal Object Detection — YOLOv11m Separate-Stem Fusion（三路轻量 Stem）
# ============================================================
# 方案: 不再用单个 5ch Conv 直接混合三模态，而是先按模态切成三路，
#       各经一个轻量 stem 升维后再 Concat 成 64ch，交给**完全不变的** YOLO11m 主干。
#
# 输入: 5 通道 [B,G,R,IR,D]（同 RGBID 早期融合；由 SilenceChannel 切出三分支）
#
#   [-1, 1, Silence, []]              # 0  5ch 透传
#   [ 0, 1, SilenceChannel, [0, 3]]   # 1  → RGB   [B,3,H,W]
#   [-1, 1, Conv, [48, 3, 2]]         # 2  → RGB   [B,48,H/2,W/2]
#   [ 0, 1, SilenceChannel, [3, 4]]   # 3  → IR    [B,1,H,W]
#   [-1, 1, Conv, [8, 3, 2]]          # 4  → IR    [B,8,H/2,W/2]
#   [ 0, 1, SilenceChannel, [4, 5]]   # 5  → Depth [B,1,H,W]
#   [-1, 1, Conv, [8, 3, 2]]          # 6  → Depth [B,8,H/2,W/2]
#   [[2, 4, 6], 1, Concat, [1]]       # 7  → 融合   [B,64,H/2,W/2]
#   [-1, 1, Conv, [128, 3, 2]]        # 8  ← 原 YOLO11m 主干 L1 起（其后整体 +7 位移）
#
# 与 configs/yolo11m_earlyfusion.yaml 的唯一差异 = 上述 0-7 共 8 层替换了原来的单层
# `Conv(5→64,3,2)`；L8-L30 与 earlyfusion 的 L1-L23 逐项相同。
# 参数量 20,061,972（earlyfusion 20,063,412，Δ = -1,440 = -0.0072%），GFLOPs@1280 272.68 vs 273.85。
#
# 唯一变量: Fusion 结构（单 5ch stem → 3 stem + concat）。其余全部冻结。
#
# ⚠ 文件名必须含 'yolo11m'：guess_model_scale（nn/tasks.py:1299 正则
#   `yolo[v]?\d+([nslmx])`）按**文件名**解析 scale，否则静默回退 nano（2.59M）。
#
# ⚠ pretrained 迁移：本布局（3ch+1ch+1ch）不在 _transfer_rgb_pretrained 原有的两条分支内，
#   已为其新增第三条显式分支（ultralytics/models/yolo/detect/train.py），
#   并在 ultralytics/models/yolo/detect/train.py::_remap_separate_stem 内做 raise-on-mismatch。
#
# 用法:
#   python scripts/train.py --model_config configs/yolo11m_sepstem.yaml \
#       --train_config configs/train_rgbid_sepstem.yaml
# ============================================================

ch: 5
# Parameters
nc: 12 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11m backbone（L8 起与 yolo11m_earlyfusion.yaml 的 L1 起逐项相同）
backbone:
  # ---- Separate-Stem Fusion（唯一变量所在）----
  - [-1, 1, Silence, []] # 0
  - [0, 1, SilenceChannel, [0, 3]] # 1  visible 3ch
  - [-1, 1, Conv, [48, 3, 2]] # 2  RGB stem
  - [0, 1, SilenceChannel, [3, 4]] # 3  infrared 1ch
  - [-1, 1, Conv, [8, 3, 2]] # 4  IR stem
  - [0, 1, SilenceChannel, [4, 5]] # 5  depth 1ch
  - [-1, 1, Conv, [8, 3, 2]] # 6  Depth stem
  - [[2, 4, 6], 1, Concat, [1]] # 7  -> 64ch
  # ---- 原 YOLO11m 主干（与 earlyfusion L1 起逐项相同）----
  - [-1, 1, Conv, [128, 3, 2]] # 8-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 9
  - [-1, 1, Conv, [256, 3, 2]] # 10-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 11
  - [-1, 1, Conv, [512, 3, 2]] # 12-P4/16
  - [-1, 2, C3k2, [512, True]] # 13
  - [-1, 1, Conv, [1024, 3, 2]] # 14-P5/32
  - [-1, 2, C3k2, [1024, True]] # 15
  - [-1, 1, SPPF, [1024, 5]] # 16
  - [-1, 2, C2PSA, [1024]] # 17

# YOLO11m head（与 earlyfusion 逐项相同，仅 backbone 引用索引 +7）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 13], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 11], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 23 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 20], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 26 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 17], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 29 (P5/32-large)

  - [[23, 26, 29], 1, Detect, [nc]] # Detect(P3, P4, P5)
