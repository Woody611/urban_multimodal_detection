# ============================================================
# Urban MultiModal Object Detection — YOLOv11 中期融合（Middle Fusion）
# ============================================================
# 方案2: 中期特征融合 —— 每模态独立分支 + 在 backbone 的 P3/P4/P5 三级做
#        Concat(3 路) + 1x1 Conv 融合，再接共享 PAN-FPN 头。
# 输入: 5 通道 [R,G,B,IR,D]（由 SilenceChannel 切出 visible/IR/depth 三分支）。
# 融合算子: Concat + 1x1 Conv（可学习加权通道融合），全部使用 fork 已有模块，
#           无需注册任何新模块。
# 代价: 约 3x 主干参数量（~7-8M，YOLO11n），精度/参数量权衡最优，推荐竞赛主方案。
#
# 用法:
#   python scripts/train.py --model_config configs/yolo11_midfusion.yaml \
#       --train_config configs/train_multimodal.yaml
# ============================================================

ch: 5
# Parameters
nc: 12 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]                          # 0
  # ---- visible 分支 (3ch) ----
  - [0, 1, SilenceChannel, [0, 3]]                # 1
  - [-1, 1, Conv, [64, 3, 2]]                     # 2
  - [-1, 1, Conv, [128, 3, 2]]                    # 3
  - [-1, 2, C3k2, [256, False, 0.25]]             # 4
  - [-1, 1, Conv, [256, 3, 2]]                    # 5
  - [-1, 2, C3k2, [512, False, 0.25]]             # 6  (vis P3)
  # ---- infrared 分支 (1ch) ----
  - [0, 1, SilenceChannel, [3, 4]]                # 7
  - [-1, 1, Conv, [64, 3, 2]]                     # 8
  - [-1, 1, Conv, [128, 3, 2]]                    # 9
  - [-1, 2, C3k2, [256, False, 0.25]]             # 10
  - [-1, 1, Conv, [256, 3, 2]]                    # 11
  - [-1, 2, C3k2, [512, False, 0.25]]             # 12 (ir P3)
  # ---- depth 分支 (1ch) ----
  - [0, 1, SilenceChannel, [4, 5]]                # 13
  - [-1, 1, Conv, [64, 3, 2]]                     # 14
  - [-1, 1, Conv, [128, 3, 2]]                    # 15
  - [-1, 2, C3k2, [256, False, 0.25]]             # 16
  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [-1, 2, C3k2, [512, False, 0.25]]             # 18 (depth P3)
  # ---- 融合 P3 ----
  - [[6, 12, 18], 1, Concat, [1]]                 # 19 (3x512=1536ch)
  - [-1, 1, Conv, [512, 1, 1]]                    # 20 (fused P3, 512ch)
  # ---- P4 各分支继续 ----
  - [6, 1, Conv, [512, 3, 2]]                     # 21
  - [-1, 2, C3k2, [512, True]]                    # 22 (vis P4)
  - [12, 1, Conv, [512, 3, 2]]                    # 23
  - [-1, 2, C3k2, [512, True]]                    # 24 (ir P4)
  - [18, 1, Conv, [512, 3, 2]]                    # 25
  - [-1, 2, C3k2, [512, True]]                    # 26 (depth P4)
  # ---- 融合 P4 ----
  - [[22, 24, 26], 1, Concat, [1]]                # 27 (3x512=1536ch)
  - [-1, 1, Conv, [512, 1, 1]]                    # 28 (fused P4, 512ch)
  # ---- P5 各分支继续 ----
  - [22, 1, Conv, [1024, 3, 2]]                   # 29
  - [-1, 2, C3k2, [1024, True]]                   # 30 (vis P5)
  - [24, 1, Conv, [1024, 3, 2]]                   # 31
  - [-1, 2, C3k2, [1024, True]]                   # 32 (ir P5)
  - [26, 1, Conv, [1024, 3, 2]]                   # 33
  - [-1, 2, C3k2, [1024, True]]                   # 34 (depth P5)
  # ---- 融合 P5 ----
  - [[30, 32, 34], 1, Concat, [1]]                # 35 (3x1024=3072ch)
  - [-1, 1, Conv, [1024, 1, 1]]                   # 36 (fused P5, 1024ch)
  - [-1, 1, SPPF, [1024, 5]]                      # 37
  - [-1, 2, C2PSA, [1024]]                        # 38

# YOLO11n head（共享 PAN-FPN，输入为融合后的 P3/P4/P5）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 39
  - [[-1, 28], 1, Concat, [1]]                    # 40 cat fused P4
  - [-1, 2, C3k2, [512, False]]                   # 41

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 42
  - [[-1, 20], 1, Concat, [1]]                    # 43 cat fused P3
  - [-1, 2, C3k2, [256, False]]                   # 44 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 45
  - [[-1, 41], 1, Concat, [1]]                    # 46 cat head P4
  - [-1, 2, C3k2, [512, False]]                   # 47 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 48
  - [[-1, 38], 1, Concat, [1]]                    # 49 cat head P5
  - [-1, 2, C3k2, [1024, True]]                   # 50 (P5/32-large)

  - [[44, 47, 50], 1, Detect, [nc]]               # 51 Detect(P3, P4, P5)
