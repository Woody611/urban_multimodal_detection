# ============================================================
# Fusion Phase 0 — 双模态 4-channel 单 stem 模型（M4 / M5 目标配置）
# ============================================================
# 覆盖 ID: M4 (RGB+IR) / M5 (RGB+Depth)
# 输入: 4ch [B, G, R, X]   X = infrared(M4) 或 depth(M5)
# 结构: stock YOLO11m，仅首个 Conv 吸收 4 通道（early fusion），其余完全一致。
#
# ⚠⚠ STATUS = BLOCKED（SHARED-SOURCE BLOCKER，见报告 §7）
#   `_transfer_rgb_pretrained`（ultralytics/models/yolo/detect/train.py）
#   的 5ch 分支写成 `in_channels == 5`，**4ch 不匹配**；随后
#   `if not any(in_channels == 1 for m in stems): return 0`
#   —— 本模型没有任何 1ch stem ⇒ 直接 return 0，**无日志、无 raise**。
#   而 `model.load(weights)` 的 intersect_dicts 已因 shape 不符静默丢弃 stem 权重。
#   ⇒ 首个 4ch Conv 会**静默保持随机初始化**，而其余层是预训练。
#   这会让 M4/M5 与 D′ **不可比**（D′ 的 RGB 分支是真预训练）。
#   在补齐 remap 之前 **不得用于训练**。
# ============================================================


ch: 4
# Parameters
nc: 12 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11m backbone（与 stock yolo11.yaml 逐项相同）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11m head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
