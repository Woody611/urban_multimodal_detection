# ============================================================
# Urban MultiModal Object Detection — YOLOv11 后期融合（Late Fusion）
# ============================================================
# 方案3: 后期融合 —— 每模态独立完整 backbone + 独立完整 neck，在 neck 输出
#        (P3/P4/P5) 处用 Concat + 1x1 Conv 加权融合，再接单个 Detect 头。
# 输入: 5 通道 [R,G,B,IR,D]。
# 融合算子: Concat + 1x1 Conv（可学习加权通道融合），全部使用 fork 已有模块。
# 代价: 精度上限最高但参数量最大（~11M，YOLO11n）、最易过拟合，作上限消融。
#
# 用法:
#   python scripts/train.py --model_config configs/yolo11_latefusion.yaml \
#       --train_config configs/train_multimodal.yaml
# ============================================================

ch: 5
# Parameters
nc: 12 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]                          # 0
  # ---- visible 分支（完整 backbone）----
  - [0, 1, SilenceChannel, [0, 3]]                # 1
  - [-1, 1, Conv, [64, 3, 2]]                     # 2
  - [-1, 1, Conv, [128, 3, 2]]                    # 3
  - [-1, 2, C3k2, [256, False, 0.25]]             # 4
  - [-1, 1, Conv, [256, 3, 2]]                    # 5
  - [-1, 2, C3k2, [512, False, 0.25]]             # 6  (vis P3)
  - [-1, 1, Conv, [512, 3, 2]]                    # 7
  - [-1, 2, C3k2, [512, True]]                    # 8  (vis P4)
  - [-1, 1, Conv, [1024, 3, 2]]                   # 9
  - [-1, 2, C3k2, [1024, True]]                   # 10 (vis P5)
  - [-1, 1, SPPF, [1024, 5]]                      # 11
  - [-1, 2, C2PSA, [1024]]                        # 12
  # ---- infrared 分支（完整 backbone）----
  - [0, 1, SilenceChannel, [3, 4]]                # 13
  - [-1, 1, Conv, [64, 3, 2]]                     # 14
  - [-1, 1, Conv, [128, 3, 2]]                    # 15
  - [-1, 2, C3k2, [256, False, 0.25]]             # 16
  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [-1, 2, C3k2, [512, False, 0.25]]             # 18 (ir P3)
  - [-1, 1, Conv, [512, 3, 2]]                    # 19
  - [-1, 2, C3k2, [512, True]]                    # 20 (ir P4)
  - [-1, 1, Conv, [1024, 3, 2]]                   # 21
  - [-1, 2, C3k2, [1024, True]]                   # 22 (ir P5)
  - [-1, 1, SPPF, [1024, 5]]                      # 23
  - [-1, 2, C2PSA, [1024]]                        # 24
  # ---- depth 分支（完整 backbone）----
  - [0, 1, SilenceChannel, [4, 5]]                # 25
  - [-1, 1, Conv, [64, 3, 2]]                     # 26
  - [-1, 1, Conv, [128, 3, 2]]                    # 27
  - [-1, 2, C3k2, [256, False, 0.25]]             # 28
  - [-1, 1, Conv, [256, 3, 2]]                    # 29
  - [-1, 2, C3k2, [512, False, 0.25]]             # 30 (depth P3)
  - [-1, 1, Conv, [512, 3, 2]]                    # 31
  - [-1, 2, C3k2, [512, True]]                    # 32 (depth P4)
  - [-1, 1, Conv, [1024, 3, 2]]                   # 33
  - [-1, 2, C3k2, [1024, True]]                   # 34 (depth P5)
  - [-1, 1, SPPF, [1024, 5]]                      # 35
  - [-1, 2, C2PSA, [1024]]                        # 36

# 三个独立 neck（每个模态一个 PAN-FPN），输出再融合
head:
  # ---- visible neck ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 37
  - [[-1, 8], 1, Concat, [1]]                     # 38 cat vis P4
  - [-1, 2, C3k2, [512, False]]                   # 39
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 40
  - [[-1, 6], 1, Concat, [1]]                     # 41 cat vis P3
  - [-1, 2, C3k2, [256, False]]                   # 42 (vis P3 head)
  - [-1, 1, Conv, [256, 3, 2]]                    # 43
  - [[-1, 39], 1, Concat, [1]]                    # 44 cat head P4
  - [-1, 2, C3k2, [512, False]]                   # 45 (vis P4 head)
  - [-1, 1, Conv, [512, 3, 2]]                    # 46
  - [[-1, 12], 1, Concat, [1]]                    # 47 cat head P5
  - [-1, 2, C3k2, [1024, True]]                   # 48 (vis P5 head)
  # ---- infrared neck ----
  - [24, 1, nn.Upsample, [None, 2, "nearest"]]    # 49
  - [[-1, 20], 1, Concat, [1]]                    # 50 cat ir P4
  - [-1, 2, C3k2, [512, False]]                   # 51
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 52
  - [[-1, 18], 1, Concat, [1]]                    # 53 cat ir P3
  - [-1, 2, C3k2, [256, False]]                   # 54 (ir P3 head)
  - [-1, 1, Conv, [256, 3, 2]]                    # 55
  - [[-1, 51], 1, Concat, [1]]                    # 56 cat head P4
  - [-1, 2, C3k2, [512, False]]                   # 57 (ir P4 head)
  - [-1, 1, Conv, [512, 3, 2]]                    # 58
  - [[-1, 24], 1, Concat, [1]]                    # 59 cat head P5
  - [-1, 2, C3k2, [1024, True]]                   # 60 (ir P5 head)
  # ---- depth neck ----
  - [36, 1, nn.Upsample, [None, 2, "nearest"]]    # 61
  - [[-1, 32], 1, Concat, [1]]                    # 62 cat depth P4
  - [-1, 2, C3k2, [512, False]]                   # 63
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 64
  - [[-1, 30], 1, Concat, [1]]                    # 65 cat depth P3
  - [-1, 2, C3k2, [256, False]]                   # 66 (depth P3 head)
  - [-1, 1, Conv, [256, 3, 2]]                    # 67
  - [[-1, 63], 1, Concat, [1]]                    # 68 cat head P4
  - [-1, 2, C3k2, [512, False]]                   # 69 (depth P4 head)
  - [-1, 1, Conv, [512, 3, 2]]                    # 70
  - [[-1, 36], 1, Concat, [1]]                    # 71 cat head P5
  - [-1, 2, C3k2, [1024, True]]                   # 72 (depth P5 head)
  # ---- 融合 P3/P4/P5 ----
  - [[42, 54, 66], 1, Concat, [1]]                # 73 (3x256=768ch)
  - [-1, 1, Conv, [256, 1, 1]]                    # 74 (fused P3)
  - [[45, 57, 69], 1, Concat, [1]]                # 75 (3x512=1536ch)
  - [-1, 1, Conv, [512, 1, 1]]                    # 76 (fused P4)
  - [[48, 60, 72], 1, Concat, [1]]                # 77 (3x1024=3072ch)
  - [-1, 1, Conv, [1024, 1, 1]]                   # 78 (fused P5)
  - [[74, 76, 78], 1, Detect, [nc]]               # 79 Detect(P3, P4, P5)
