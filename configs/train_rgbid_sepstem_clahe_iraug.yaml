# ============================================================
# D′_IRAug —— D′ + IR-specific 光度增强（gamma + Gaussian noise）
# ============================================================
# 本文件是 configs/train_rgbid_sepstem_clahe.yaml（= **D′ 的训练配置**，线上 48.712）
# 的**逐字副本**，唯一新增 = 末尾 4 行 IR augmentation 键 + experiment_name。
#
#   D′      : --model_config configs/yolo11m_sepstem.yaml
#             --train_config configs/train_rgbid_sepstem_clahe.yaml
#   D′_IRAug: --model_config configs/yolo11m_sepstem.yaml      ← **完全相同**
#             --train_config configs/train_rgbid_sepstem_clahe_iraug.yaml
#
# ⇒ D′ vs D′_IRAug 的差异**恰好一项**：IR-specific gamma/noise augmentation。
#   model / loss / TAL / optimizer / LR / scheduler / epochs / batch / imgsz /
#   seed / Depth preprocessing / RGB augmentation / validation / inference /
#   提交链路 **全部逐字不变**。
#
# ⚠ 唯一变量纪律：不得在本文件改动任何其它超参。
#
# IR aug 的实现位置（见 ultralytics/data/base.py::apply_ir_augmentation）：
#   原图 → CLAHE(uint8 单通道) → **[gamma; noise]** → merge 5ch → resize
#        → mosaic/几何 → /255 → SepStem
#   即作用在 **模型实际看到的 IR 表示** 上，仅训练；val/推理/提交不经过该函数。
# ============================================================

experiment_name: "urban_multimodal_det_yolo11_rgbid_sepstem_clahe_iraug"
seed: 42
pretrained: "yolo11m.pt"

device: "cuda"
gpu_ids: [0]

epochs: 300
patience: 0              # 禁用早停（与 D 的完整 300 epoch 预算严格一致）
batch_size: 8
image_size: [1280, 1280]
num_workers: 4

learning_rate: 5.0e-3
warmup_epochs: 3

optimizer:
  type: "SGD"
  momentum: 0.937
  weight_decay: 5.0e-4

scheduler:
  type: "CosineAnnealingLR"

amp: true
val_ratio: 0.2

use_simotm: "RGBID"
pairs_rgb_ir: ["visible", "infrared"]
pairs_rgb_depth: ["visible", "depth"]
channels: 5

# ⚠️ D′ 的核心变量之一，**不可删**（缺它会静默回落 percentile）
ir_encoding: clahe

checkpoint:
  save_dir: "runs/${experiment_name}/weights"
  save_interval: 10
  save_best: true
  save_last: true
  resume: false
  resume_path: ""

# ============================================================
# ★ 唯一新增变量：IR-specific 光度增强 —— **仅训练**
# ------------------------------------------------------------
# 数值域（已锁死，见 diagnostic/ir_aug_audit/）：
#   IR 进入本步时 = uint8 单通道 [0,255]（CLAHE 之后）。
#   ir_gamma : x=im/255 ∈[0,1] → x**gamma → clip[0,1] → ×255 → uint8
#   ir_noise : im/255 + N(0, ir_noise_std) → clip[0,1] → ×255 → uint8
#              ⇒ ir_noise_std 的单位是**归一化 [0,1] 域**（灰度级 σ = 值 × 255 = 3.825）
#
# 概率语义（实测，非假设）：Mosaic 的 buffer + ims 缓存使每训练样本恰好
#   **1.0 次**预处理调用（40 samples → 40 calls）⇒ 概率 **就是**「被增强图像的比例」，
#   **不存在 Mosaic 放大**。
#
# 参数依据（全部来自本项目数据统计，未照搬外部 repo）：
#   gamma [0.75,1.35]：诱导的曝光伸缩 1.304× / 0.710×（比值 1.84），
#     **小于**本数据图与图之间天然曝光跨度 p95/p05 = 2.69× ⇒ 落在自然流形内。
#   p=0.35：≈1/3 的训练图像带 gamma 抖动。
#   noise σ=0.015 ⇒ 3.825 灰度级；本数据 CLAHE 输出 std≈60 灰度级 ⇒ SNR≈15.7，属温和传感器噪声。
# ============================================================
ir_gamma: [0.75, 1.35]
ir_gamma_probability: 0.35
ir_noise_std: 0.015
ir_noise_probability: 0.20
