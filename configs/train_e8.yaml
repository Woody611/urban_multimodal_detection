# ============================================================
# E8-A — YOLO11m + RGB+Depth 中期融合 + 1024（唯一变量: load_image 主导下采样阶段
#          Depth resize INTER_LINEAR -> INTER_NEAREST，RGB 保持 INTER_LINEAR）
# ============================================================
# 在 E7（YOLO11m RGBD pretrained, mAP50-95=0.50878, 1024）基础上，仅修改
# ultralytics/data/base.py 的 load_image 中合并 4ch 图像 resize：RGB 用 INTER_LINEAR，
# Depth 用 INTER_NEAREST（新增 _resize_rgbd helper，use_simotm=="RGBD" 时触发）。
# 后续 RandomPerspective / warpAffine / warpPerspective / multi_channel_resize / LetterBox
# 均保持不变（对 4ch 仍用 INTER_LINEAR）。
# model yaml 完全复用 E7 的 configs/yolo11m_midfusion_rgbd_concat_res.yaml（P3/P4/P5）。
# RGB 分支真正加载 yolo11m.pt 预训练，depth stem 用 W_depth = mean(W_R,W_G,W_B) 初始化。
# 优化器/aug/seed/切分与 E7 完全一致；batch=8（E7 已证明 1024 + batch16 会 CUDA OOM）。
# 命令:
#   python scripts/train.py --model_config configs/yolo11m_midfusion_rgbd_concat_res.yaml \
#       --train_config configs/train_e8.yaml
# ============================================================

experiment_name: "urban_multimodal_det_e8_yolo11m_rgbd_nearest"
seed: 42
pretrained: "yolo11m.pt"

device: "cuda"
gpu_ids: [0]

epochs: 300
patience: 80
batch_size: 8
image_size: [1024, 1024]
num_workers: 4

learning_rate: 1.0e-2
warmup_epochs: 3

optimizer:
  type: "SGD"
  momentum: 0.937
  weight_decay: 5.0e-4

scheduler:
  type: "CosineAnnealingLR"

amp: true
val_ratio: 0.2

use_simotm: "RGBD"
pairs_rgb_ir: ["visible", "depth"]
pairs_rgb_depth: ["visible", "depth"]
channels: 4

checkpoint:
  save_dir: "runs/${experiment_name}/weights"
  save_interval: 10
  save_best: true
  save_last: true
  resume: false
  resume_path: ""
