# ============================================================
# ⚠⚠ STATUS = BLOCKED ×2
#   (a) 数据侧：本 fork **没有** IR+Depth 的组合模式。base.py 的
#       _merge_channels* 只有 (RGB+IR) / (RGB+IR+RGB) / (RGB+IR+D) / (RGB+D)。
#   (b) 模型侧：同 M4/M5 的 4ch/2ch 预训练 remap 缺失。
#   最小修复需要新增一个 'IRD' 数据分支 + 扩展 remap。本轮**仅登记，不实现**。
