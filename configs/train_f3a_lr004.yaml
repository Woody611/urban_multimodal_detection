# ============================================================
# F3a — F1 单变量实验: lr0 进一步降低 (learning_rate 0.005 -> 0.004)
# ============================================================
# 唯一变量: learning_rate（train.py 映射到 ultralytics lr0） 5.0e-3 -> 4.0e-3。
# 目的: 验证 F1(lr0=0.005) 是否仍偏高，继续降到 0.004 能否获得更高、更稳定的 mAP。
#
# 本文件是 configs/train_e7_lr0half.yaml (F1) 的逐行副本，仅两处不同:
#   1. experiment_name: 改为 ..._yolo11_rgbd_f3a_lr004（新目录，绝不覆盖 F1/F2）
#   2. learning_rate: 5.0e-3 -> 4.0e-3（唯一实验变量）
#
# 其余全部继承 F1 实际生效配置:
#   SGD(momentum=0.937, wd=5e-4, nesterov=True 源码硬编码), lrf=0.01(默认),
#   cos_lr=True(scheduler.type), warmup 3/0.8/0.1, batch=8, epochs=300,
#   patience=80, imgsz=1024, seed=42, deterministic=True(默认), close_mosaic=10(默认),
#   模型结构 / 数据集切分 / RGBD 4ch 管线 / Depth 预处理 / 增强 全部不变。
# 不修改任何模型代码。
#
# 命令:
#   python scripts/train.py --model_config configs/yolo11m_midfusion_rgbd_concat_res.yaml \
#       --train_config configs/train_f3a_lr004.yaml
# ============================================================

experiment_name: "urban_multimodal_det_yolo11_rgbd_f3a_lr004"
seed: 42
pretrained: "yolo11m.pt"

device: "cuda"
gpu_ids: [0]

epochs: 300
patience: 80
batch_size: 8
image_size: [1024, 1024]
num_workers: 4

learning_rate: 4.0e-3
warmup_epochs: 3

optimizer:
  type: "SGD"
  momentum: 0.937
  weight_decay: 5.0e-4

scheduler:
  type: "CosineAnnealingLR"

amp: true
val_ratio: 0.2

use_simotm: "RGBD"
pairs_rgb_ir: ["visible", "depth"]
pairs_rgb_depth: ["visible", "depth"]
channels: 4

checkpoint:
  save_dir: "runs/${experiment_name}/weights"
  save_interval: 10
  save_best: true
  save_last: true
  resume: false
  resume_path: ""
