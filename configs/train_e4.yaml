# ============================================================
# E4 — YOLO11m + RGB+Depth 中期融合 + 640（唯一变量: 相对 E2 增加模型规模 s -> m）
# ============================================================
# 在 E2（YOLO11s RGBD pretrained, mAP50-95=0.45419）基础上，仅将模型规模 s -> m，
# 验证 mAP@0.5:0.95 是否继续提升。RGB 分支真正加载 yolo11m.pt 预训练
# （detect/train.py 的 _transfer_rgb_pretrained 做 index 重映射），
# depth stem 用 W_depth = mean(W_R,W_G,W_B) 初始化。
# 优化器/aug/seed/切分与 E2 完全一致（lr0=1e-2, warmup 3, wd 5e-4），保证唯一变量是模型规模。
# 命令:
#   python scripts/train.py --model_config configs/yolo11m_midfusion_rgbd_concat_res.yaml \
#       --train_config configs/train_e4.yaml
# ============================================================

experiment_name: "urban_multimodal_det_e4_yolo11m_rgbd"
seed: 42
pretrained: "yolo11m.pt"

device: "cuda"
gpu_ids: [0]

epochs: 300
patience: 80
batch_size: 16
image_size: [640, 640]
num_workers: 4

learning_rate: 1.0e-2
warmup_epochs: 3

optimizer:
  type: "SGD"
  momentum: 0.937
  weight_decay: 5.0e-4

scheduler:
  type: "CosineAnnealingLR"

amp: true
val_ratio: 0.2

use_simotm: "RGBD"
pairs_rgb_ir: ["visible", "depth"]
pairs_rgb_depth: ["visible", "depth"]
channels: 4

checkpoint:
  save_dir: "runs/${experiment_name}/weights"
  save_interval: 10
  save_best: true
  save_last: true
  resume: false
  resume_path: ""
