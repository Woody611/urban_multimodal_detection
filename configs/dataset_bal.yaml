# ============================================================
# Urban Multi-Modal Object Detection — 类别过采样数据集配置
# ============================================================
# 与 configs/dataset.yaml 完全一致，仅把 train 指向类别过采样目录 train_bal/visible。
# train_bal 由 scripts/oversample_rare.py 生成：稀有类所在图按 ratio 重复
# （硬链接，磁盘零额外占用），副本命名 <stem>_balN，用于解决类别不平衡。
# 训练时 train.py 的 _split_train_val_depth 会从 train_bal/ 读取，并按【原图 stem】
# 分组切分（原图 + _balN 副本同侧），杜绝近重复样本泄漏到 val。
#
# path 字段与 dataset.yaml 相同（d:/gyt/...）。在 Linux/AutoDL 上该 Windows 路径
# 不存在，_resolve_raw_root 会回退到项目根下的 data/raw，行为与原配置一致。
# ============================================================

# ---- 数据集根目录 -------------------------------------------
path: "d:/gyt/AIC/urban_multimodal_detection/data/raw"

# ---- 划分路径 (relative to `path`, 均指向 visible 主输入) ------
train: train_bal/visible      # 类别过采样训练集（稀有类重复，主输入 visible）
val:   test/visible           # 验证集（占位; test 无标注，训练时按 val_ratio 从 train_bal 重切）
test:  test/visible           # 测试集

# ---- 类别 (12 类, 顺序即 class id) ---------------------------
nc: 12
names:
  0: person
  1: boat
  2: animal
  3: seat
  4: sign
  5: bicycle
  6: car
  7: ball
  8: light
  9: garbage_can
  10: uav
  11: tricycle
