# ============================================================
# Urban Multi-Modal Object Detection — RGB+Depth 6 通道融合训练配置
# ============================================================
# 配合 configs/yolo11_midfusion_rgbd_add6ch.yaml 使用。
# 由 scripts/train.py 读取（--train_config），模型 yaml 由 --model_config 指定。
#
# 相对 train_multimodal_rgbd.yaml（4ch）仅一处关键改动：
#   channels: 4 -> 6（门控 6ch 增强分支，复用 RGBRGB6C 的 6ch 路径）。
#   数据加载三倍复制 depth 输出 6ch [B,G,R,D,D,D]（Format 后为 [R,G,B,D,D,D]）。
#
# 超参与 train_multimodal_rgbd.yaml 保持一致，便于与 rgbd2~5（4ch）做干净对照，
# 唯一变量是「depth 分支是否三倍复制走预训练 stem」。
# ============================================================

# ---- Experiment ----------------------------------------------
experiment_name: "urban_multimodal_det_yolo11_rgbd6"
seed: 42

# ---- Pretrain -------------------------------------------------
pretrained: true                     # true=ImageNet 预训练（visible + depth 分支都迁移，depth 三倍复制→3→64）

# ---- Device --------------------------------------------------
device: "cuda"                       # cuda | cpu
gpu_ids: [0]                         # 单卡: [0]; 多卡: [0,1,2,3]

# ---- Training hyperparameters --------------------------------
epochs: 200
patience: 80                         # 早停: 连续 80 epoch 无提升才停止
batch_size: 12                       # 6ch 显存约为 RGB 的 2x，OOM 时降到 8
image_size: [640, 640]               # [height, width]
num_workers: 4

# ---- Learning rate -------------------------------------------
learning_rate: 5.0e-3                # 与 RGB 单模态一致
warmup_epochs: 10                    # 更长 warmup，给新增 depth 通道更长适应期
warmup_start_lr: 1.0e-6
min_lr_ratio: 0.01                   # 最终 lr = base_lr × min_lr_ratio

# ---- Data augmentation (6ch；depth 为灰度，关闭 Hue/Saturation) ----
aug:
  hsv_h: 0.0                         # depth 灰度，Hue 无意义
  hsv_s: 0.0                         # 同上
  hsv_v: 0.0                         # 关闭 HSV：depth 为深度/灰度，颜色抖动无意义
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5                        # 左右翻转，检测关键增强
  mosaic: 0.5                        # 降低 mosaic（深度模态对强 mosaic 敏感）
  mixup: 0.0                         # 关闭（灰度 depth 是噪声）
  copy_paste: 0.0
  erasing: 0.4
  close_mosaic: 10                   # 最后 10 epoch 关闭 mosaic

# ---- Optimizer -----------------------------------------------
optimizer:
  type: "SGD"                        # SGD | Adam | AdamW
  momentum: 0.937
  weight_decay: 1.0e-4
  nesterov: true

# ---- Scheduler -----------------------------------------------
scheduler:
  type: "CosineAnnealingLR"          # CosineAnnealingLR | StepLR | MultiStepLR | OneCycleLR

# ---- Mixed precision -----------------------------------------
amp: true                            # Automatic Mixed Precision (FP16)

# ---- Gradient ------------------------------------------------
grad_clip_max_norm: 10.0

# ---- EMA (Exponential Moving Average) ------------------------
ema:
  enabled: true
  decay: 0.9999

# ---- Validation ----------------------------------------------
val_interval: 1                      # 每 N 个 epoch 验证一次
val_ratio: 0.2                       # 无独立 val 时，从 train 切分的验证集比例

# ---- 多模态 (RGB + Depth 6 通道) ------------------------------
use_simotm: "RGBD"                   # RGBD = visible+depth 三倍复制合并为 6ch
pairs_rgb_ir: ["visible", "depth"]   # visible 主输入 -> depth 第二模态（base.py 走 pairs_ir）
pairs_rgb_depth: ["visible", "depth"]  # depth 映射（dataset.py/loaders.py 走 pairs_depth）
channels: 6                          # 输入通道数（门控 6ch 增强分支）

# ---- Evaluation metrics --------------------------------------
evaluation_metric:
  - "mAP_0.5"
  - "mAP_0.5:0.95"

# ---- Checkpoint ----------------------------------------------
checkpoint:
  save_dir: "runs/${experiment_name}/weights"
  save_interval: 10
  save_best: true
  best_metric: "mAP_0.5:0.95"
  save_last: true
  max_keep: 5
  resume: false
  resume_path: ""

# ---- Logging -------------------------------------------------
log_dir: "runs/${experiment_name}/logs"
log_interval: 50
tensorboard:
  enabled: true
  log_dir: "runs/${experiment_name}/tensorboard"
