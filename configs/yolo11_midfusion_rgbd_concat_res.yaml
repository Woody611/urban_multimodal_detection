# ============================================================
# Urban MultiModal — YOLOv11 中期融合（RGB+Depth，残差 Concat+1×1 Conv，偏置 depth）
# ============================================================
# 在 yolo11_midfusion_rgbd_concat.yaml（rgbd7, 0.306）基础上加一条残差：
#   fused = depth + Conv(Concat(rgb, depth))
#
# 动机：rgbd7 结果——recall 0.518 已超过 depth-only(0.511)，说明融合确实从 RGB
#   拿到了互补信息（多找到了目标）；但 mAP50-95 0.306 仍略低于 depth-only(0.312)，
#   说明融合把 depth 的定位/几何优势稀释了。depth 是最强模态（定位强），
#   RGB 是辅助（外观/召回强）。残差偏置 depth：让 depth 作为「基底」被完整保留，
#   1×1 Conv 只学 RGB 带来的「修正量」delta 叠加到 depth 上，而不是把两者平均。
#   最坏情况 delta≈0 → 退化为 depth-only(0.312)，下界有保底；最好情况突破 0.312。
#
# 输入: 4 通道 [R,G,B,D]。融合点 P3/P4/P5：Concat → 1×1 Conv(delta) → ADD 回 depth。
# 参数量: 约 3.75M（比 rgbd7 仅多 3 个 ADD，无额外可学习参数）。
#
# 用法:
#   python scripts/train.py --model_config configs/yolo11_midfusion_rgbd_concat_res.yaml \
#       --train_config configs/train_multimodal_rgbd.yaml
# ============================================================

ch: 4
# Parameters
nc: 12 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]                          # 0
  # ---- visible 分支 (3ch) ----
  - [0, 1, SilenceChannel, [0, 3]]                # 1
  - [-1, 1, Conv, [64, 3, 2]]                     # 2
  - [-1, 1, Conv, [128, 3, 2]]                    # 3
  - [-1, 2, C3k2, [256, False, 0.25]]             # 4
  - [-1, 1, Conv, [256, 3, 2]]                    # 5
  - [-1, 2, C3k2, [512, False, 0.25]]             # 6  (vis P3)
  # ---- depth 分支 (1ch) ----
  - [0, 1, SilenceChannel, [3, 4]]                # 7
  - [-1, 1, Conv, [64, 3, 2]]                     # 8
  - [-1, 1, Conv, [128, 3, 2]]                    # 9
  - [-1, 2, C3k2, [256, False, 0.25]]             # 10
  - [-1, 1, Conv, [256, 3, 2]]                    # 11
  - [-1, 2, C3k2, [512, False, 0.25]]             # 12 (depth P3)
  # ---- 残差 Concat+Conv 融合 P3：fused = depth + delta ----
  - [[6, 12], 1, Concat, [1]]                     # 13  (1024ch)
  - [-1, 1, Conv, [512, 1, 1]]                    # 14 (delta, 512ch)
  - [[14, 12], 1, ADD, [1.0]]                     # 15 (fused P3 = depth + delta)
  # ---- P4 各分支继续 ----
  - [6, 1, Conv, [512, 3, 2]]                     # 16
  - [-1, 2, C3k2, [512, True]]                    # 17 (vis P4)
  - [12, 1, Conv, [512, 3, 2]]                    # 18
  - [-1, 2, C3k2, [512, True]]                    # 19 (depth P4)
  # ---- 残差 Concat+Conv 融合 P4 ----
  - [[17, 19], 1, Concat, [1]]                    # 20  (1024ch)
  - [-1, 1, Conv, [512, 1, 1]]                    # 21 (delta, 512ch)
  - [[21, 19], 1, ADD, [1.0]]                     # 22 (fused P4 = depth + delta)
  # ---- P5 各分支继续 ----
  - [17, 1, Conv, [1024, 3, 2]]                   # 23
  - [-1, 2, C3k2, [1024, True]]                   # 24 (vis P5)
  - [19, 1, Conv, [1024, 3, 2]]                   # 25
  - [-1, 2, C3k2, [1024, True]]                   # 26 (depth P5)
  # ---- 残差 Concat+Conv 融合 P5 ----
  - [[24, 26], 1, Concat, [1]]                    # 27  (2048ch)
  - [-1, 1, Conv, [1024, 1, 1]]                   # 28 (delta, 1024ch)
  - [[28, 26], 1, ADD, [1.0]]                     # 29 (fused P5 = depth + delta)
  - [-1, 1, SPPF, [1024, 5]]                      # 30
  - [-1, 2, C2PSA, [1024]]                        # 31

# YOLO11n head（共享 PAN-FPN，输入为融合后的 P3/P4/P5）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 32
  - [[-1, 22], 1, Concat, [1]]                    # 33 cat fused P4
  - [-1, 2, C3k2, [512, False]]                   # 34

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 35
  - [[-1, 15], 1, Concat, [1]]                    # 36 cat fused P3
  - [-1, 2, C3k2, [256, False]]                   # 37 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 38
  - [[-1, 34], 1, Concat, [1]]                    # 39 cat head P4
  - [-1, 2, C3k2, [512, False]]                   # 40 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 41
  - [[-1, 31], 1, Concat, [1]]                    # 42 cat head P5
  - [-1, 2, C3k2, [1024, True]]                   # 43 (P5/32-large)

  - [[37, 40, 43], 1, Detect, [nc]]               # 44 Detect(P3, P4, P5)
