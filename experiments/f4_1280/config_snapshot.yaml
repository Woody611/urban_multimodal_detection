# ============================================================
# F4 — 单变量实验: imgsz 1024 -> 1280
# ============================================================
# 唯一变量: image_size 1024 -> 1280（train.py 取 image_size[0] 映射到 ultralytics imgsz）。
# 目的: 验证提高输入分辨率能否改善小目标召回与定位，从而提高官方 mAP@0.5:0.95。
#       （依据 reports/f1_next_experiment_recommendation.md 实验 1：第一瓶颈是小目标召回，
#         sign/bicycle/ball 在 conf=0.001+IoU=0.45 下检测率仅 52.6~60.0%，属硬漏检。）
#
# 本文件是 configs/train_e7_lr0half.yaml（= F1 实际训练配置）的逐行副本，仅两处不同:
#   1. experiment_name: urban_multimodal_det_e7_lr0half -> urban_multimodal_det_yolo11_rgbd_f4_1280
#      （独立目录，绝不覆盖 F1 / F2 / F3a）
#   2. image_size: [1024, 1024] -> [1280, 1280]（唯一变量）
#
# 其余全部与 F1 逐字一致（已对照 F1 落盘的 runs/urban_multimodal_det_e7_lr0half/args.yaml 核验）:
#   SGD(momentum=0.937, wd=5e-4, nesterov=True 源码硬编码), lr0=0.005, lrf=0.01, cos_lr=True,
#   warmup_epochs=3 / warmup_momentum=0.8 / warmup_bias_lr=0.1（均走 ultralytics 默认，本文件不覆盖）,
#   epochs=300, patience=80, batch=8, seed=42, deterministic=true, amp=true, val=true,
#   无 aug 段 → 增强全部取 ultralytics 默认（mosaic=1.0, mixup=0.0, copy_paste=0.0,
#   degrees=0.0, translate=0.1, scale=0.5, shear=0.0, perspective=0.0, flipud=0.0, fliplr=0.5,
#   hsv_h=0.015, hsv_s=0.7, hsv_v=0.4, erasing=0.4, close_mosaic=10）——与 F1 args.yaml 完全一致。
#   模型结构 / 数据集切分（val_ratio=0.2, seed=42 → depth_split_train）/ RGBD 4ch 管线 /
#   Depth 预处理 / conf=0.001 / iou=0.7 / max_det=300 全部不变。
#   loss gain（box=7.5, cls=0.5, dfl=1.5）与 nbs=64 走默认，本文件不覆盖。
#
# 不修改任何模型代码，不 resume F1（从零训练）。
#
# 命令:
#   python scripts/train.py --model_config configs/yolo11m_midfusion_rgbd_concat_res.yaml \
#       --train_config configs/train_f4_1280.yaml
# ============================================================

experiment_name: "urban_multimodal_det_yolo11_rgbd_f4_1280"
seed: 42
pretrained: "yolo11m.pt"

device: "cuda"
gpu_ids: [0]

epochs: 300
patience: 80
batch_size: 8
image_size: [1280, 1280]
num_workers: 4

learning_rate: 5.0e-3
warmup_epochs: 3

optimizer:
  type: "SGD"
  momentum: 0.937
  weight_decay: 5.0e-4

scheduler:
  type: "CosineAnnealingLR"

amp: true
val_ratio: 0.2

use_simotm: "RGBD"
pairs_rgb_ir: ["visible", "depth"]
pairs_rgb_depth: ["visible", "depth"]
channels: 4

checkpoint:
  save_dir: "runs/${experiment_name}/weights"
  save_interval: 10
  save_best: true
  save_last: true
  resume: false
  resume_path: ""
